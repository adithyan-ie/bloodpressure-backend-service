services:

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"    # host machines (Jenkins, kcat, your laptop)
      - "29092:29092"  # internal Docker network (kafka-ui, Flink)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ── Kafka UI ───────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      AUTH_TYPE: "DISABLED"

  # ── kcat (kafkacat) ────────────────────────────────────────────────────
  # Lightweight CLI tool for producing and consuming Kafka messages.
  # Used by the Jenkins pipeline (sendToKafka function) to publish
  # per-stage CI/CD events to the cicd-events topic.
  #
  # The container stays running via `tail -f /dev/null` so Jenkins can
  # exec into it at any time with:
  #   docker exec kcat kcat -P -b kafka:29092 -t cicd-events ...
  #
  # It is also available on the HOST via the mapped port — from your
  # terminal you can run:
  #   docker exec kcat kcat -C -b kafka:29092 -t cicd-events -e
  kcat:
    image: confluentinc/cp-kcat:latest
    container_name: kcat
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]   # keep container alive indefinitely
    environment:
      # Pre-configure the default broker so you can call kcat without -b
      KCAT_BROKERS: kafka:29092
    networks:
      - default

volumes:
  kafka-data: