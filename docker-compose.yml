services:

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"      # host machines (your laptop, host tools)
      - "29092:29092"    # internal Docker network (kafka-ui, kcat, Jenkins)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cicd-network

  # ── Kafka UI ───────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"    # http://localhost:8081
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      AUTH_TYPE: "DISABLED"
    networks:
      - cicd-network

  # ── kcat ──────────────────────────────────────────────────────────────
  # Stays alive so Jenkins can exec into it to send Kafka messages:
  #   docker exec -i kcat kcat -P -b kafka:29092 -t cicd-events ...
  kcat:
    image: confluentinc/cp-kcat:latest
    container_name: kcat
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      KCAT_BROKERS: kafka:29092
    networks:
      - cicd-network

  # ── Jenkins ────────────────────────────────────────────────────────────
  # Runs on the same Docker network so it can:
  #   1. Reach Kafka directly on kafka:29092
  #   2. Run `docker exec -i kcat kcat ...` via the Docker socket mount
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root    # needed to access /var/run/docker.sock
    ports:
      - "8080:8080"     # Jenkins UI  → http://localhost:8080
      - "50000:50000"   # Jenkins agent inbound port
    volumes:
      - jenkins-data:/var/jenkins_home
      # Mount Docker socket so Jenkins can run `docker exec` against
      # the kcat container without needing kcat installed locally.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Skip the initial setup wizard — remove this line for first-time
      # production installs where you want the wizard.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    # Install Docker CLI on container startup so `docker exec` is available
    # inside Jenkins pipeline shell steps.
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq docker.io &&
        /usr/bin/tini -- /usr/local/bin/jenkins.sh
      "
    depends_on:
      kcat:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - cicd-network

networks:
  cicd-network:
    driver: bridge

volumes:
  kafka-data:
  jenkins-data: